openapi: 3.0.3
info:
  title: Buscador e Gestor de Medicamentos — contrato de referência
  version: 0.1.0-proposto
  description: Esqueleto contratual para desenvolvimento incremental. Não é serviço implementado; exige revisão de DTOs, regras
    de autorização, paginação, erro e consentimento antes de homologação.
servers:
- url: http://localhost:8000
  description: DEV local, exemplo somente
tags:
- name: Auth
- name: Family
- name: Catalog
- name: Stock
- name: Treatments
- name: Doses
- name: Sync
- name: Replenishment
- name: Shopping
- name: Offers
- name: Privacy
- name: Ops
security:
- bearerAuth: []
paths:
  /v1/auth/signup:
    post:
      tags:
      - Auth
      operationId: signup
      summary: Criar conta do titular
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      security: []
  /v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Autenticar titular
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
