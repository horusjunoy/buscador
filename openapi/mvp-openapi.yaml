        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/households:
    get:
      tags:
      - Family
      operationId: listHouseholds
      summary: Listar domicílios autorizados
      responses:
        '200':
          description: Lista paginável; envelope exato deve ser fixado e testado
          content:
            application/json:
              schema:
