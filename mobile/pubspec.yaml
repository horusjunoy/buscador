name: buscador
description: Buscador e Gestor de Medicamentos - núcleo local e HML.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  crypto: 3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/illustrations/
    - assets/fonts/LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
